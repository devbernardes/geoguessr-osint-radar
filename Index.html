<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>GeoOSINT Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 280px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 font-sans pb-10">

  <div class="max-w-md mx-auto space-y-3">
    <!-- Top Bar Compacta -->
    <header class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between shadow">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛰️</span>
        <h1 class="text-base font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">GeoOSINT Mobile</h1>
      </div>
      <button onclick="toggleSettings()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">
        ⚙️ API Key
      </button>
    </header>

    <!-- Gaveta de API Key (Oculta após salvar) -->
    <div id="settingsPanel" class="hidden bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2">
      <p class="text-xs text-slate-400">Insira sua chave do Google AI Studio (salva apenas no seu celular):</p>
      <div class="flex gap-2">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." 
          class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm flex-grow focus:outline-none focus:border-emerald-500">
        <button onclick="saveApiKey()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold">
          Salvar
        </button>
      </div>
    </div>

    <!-- Botões de Ação Rápida Mobile -->
    <div class="grid grid-cols-2 gap-2">
      <label class="bg-slate-900 active:bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer text-center shadow">
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        <span class="text-2xl mb-1">🖼️</span>
        <span class="text-xs font-bold text-emerald-400">Escolher Print</span>
        <span class="text-[10px] text-slate-400">Última foto da galeria</span>
      </label>

      <button onclick="pasteFromClipboard()" class="bg-slate-900 active:bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center text-center shadow">
        <span class="text-2xl mb-1">📋</span>
        <span class="text-xs font-bold text-cyan-400">Colar Print</span>
        <span class="text-[10px] text-slate-400">Da área de transferência</span>
      </button>
    </div>

    <!-- Preview Compacto + Botão Analisar -->
    <div id="previewContainer" class="hidden bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex items-center gap-3">
      <img id="previewImg" class="h-16 w-24 object-cover rounded-lg border border-slate-700" />
      <button id="analyzeBtn" onclick="analyzeImage()" 
        class="flex-grow bg-gradient-to-r from-emerald-600 to-teal-600 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg text-sm transition">
        🔍 Rastrear Local
      </button>
    </div>

    <!-- Mapa Mundi Interativo -->
    <div class="bg-slate-900 border border-slate-800 p-1.5 rounded-xl shadow">
      <div id="map"></div>
    </div>

    <!-- Card de Resultado -->
    <div id="resultCard" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 shadow">
      <div class="flex justify-between items-start border-b border-slate-800 pb-2">
        <div>
          <h2 id="resCountry" class="text-xl font-bold text-emerald-400 leading-tight">-</h2>
          <p id="resRegion" class="text-xs text-slate-300">-</p>
        </div>
        <span id="resConfidence" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-emerald-300 border border-slate-700">-</span>
      </div>

      <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-xs font-mono">
        <div><span class="text-slate-500">LAT:</span> <span id="resLat" class="text-cyan-400">-</span></div>
        <div><span class="text-slate-500">LNG:</span> <span id="resLng" class="text-cyan-400">-</span></div>
        <a id="gmapsLink" href="#" target="_blank" class="text-emerald-400 underline font-sans font-semibold">Abrir Maps ↗</a>
      </div>

      <div>
        <h3 class="text-[11px] uppercase tracking-wider text-slate-400 mb-1.5 font-semibold">Pistas Identificadas:</h3>
        <ul id="resClues" class="text-xs text-slate-300 space-y-1 list-disc list-inside"></ul>
      </div>
    </div>

  </div>

  <script>
    let currentBase64 = null;
    let map, marker;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_geo_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
      } else {
        document.getElementById('settingsPanel').classList.remove('hidden');
      }

      map = L.map('map', { zoomControl: false }).setView([15, 0], 2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CARTO'
      }).addTo(map);
    };

    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) return alert('Insira uma API Key válida!');
      localStorage.setItem('gemini_geo_key', key);
      document.getElementById('settingsPanel').classList.add('hidden');
      alert('Chave salva!');
    }

    // Suporte a colar pelo teclado do celular
    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          compressAndLoadImage(item.getAsFile());
          break;
        }
      }
    });

    async function pasteFromClipboard() {
      try {
        const clipboardItems = await navigator.clipboard.read();
        for (const item of clipboardItems) {
          const imageType = item.types.find(type => type.startsWith('image/'));
          if (imageType) {
            const blob = await item.getType(imageType);
            compressAndLoadImage(blob);
            return;
          }
        }
        alert('Nenhuma imagem encontrada na área de transferência.');
      } catch (err) {
        alert('Permita o acesso à área de transferência ou use o botão "Escolher Print".');
      }
    }

    function handleFileSelect(e) {
      if (e.target.files.length > 0) compressAndLoadImage(e.target.files[0]);
    }

    // Comprime o print do celular para envio ultrarrápido
    function compressAndLoadImage(file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1280;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          currentBase64 = dataUrl.split(',')[1];
          
          document.getElementById('previewImg').src = dataUrl;
          document.getElementById('previewContainer').classList.remove('hidden');
          // Inicia a análise automaticamente assim que carrega o print!
          analyzeImage();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function analyzeImage() {
      const apiKey = document.getElementById('apiKeyInput').value.trim() || localStorage.getItem('gemini_geo_key');
      if (!apiKey) {
        document.getElementById('settingsPanel').classList.remove('hidden');
        return alert('Configure sua API Key primeiro.');
      }
      if (!currentBase64) return;

      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      btn.innerText = '⏳ Escaneando...';

      const prompt = `Você é um especialista mundial em GeoGuessr e geolocalização OSINT.
Analise esta captura de tela (ignore elementos de interface/HUD do jogo no topo ou base da tela) examinando mão de direção, sol, postes, bollards, faixas da pista, placas, arquitetura, relevo, solo e vegetação.
Retorne EXCLUSIVAMENTE um JSON válido neste formato:
{
  "pais": "Nome do País",
  "regiao": "Estado, província ou cidade aproximada",
  "lat": 0.0000,
  "lng": 0.0000,
  "confianca": "Alta | Média | Baixa",
  "pistas": ["Pista 1 curta e direta", "Pista 2 curta e direta", "Pista 3 curta e direta"]
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: currentBase64 } }
              ]
            }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const result = JSON.parse(data.candidates[0].content.parts[0].text);

        document.getElementById('resultCard').classList.remove('hidden');
        document.getElementById('resCountry').innerText = result.pais;
        document.getElementById('resRegion').innerText = result.regiao;
        document.getElementById('resConfidence').innerText = result.confianca;
        document.getElementById('resLat').innerText = Number(result.lat).toFixed(4);
        document.getElementById('resLng').innerText = Number(result.lng).toFixed(4);
        document.getElementById('gmapsLink').href = `https://www.google.com/maps?q=${result.lat},${result.lng}`;

        const cluesList = document.getElementById('resClues');
        cluesList.innerHTML = '';
        result.pistas.forEach(c => {
          const li = document.createElement('li');
          li.innerText = c;
          cluesList.appendChild(li);
        });

        if (marker) map.removeLayer(marker);
        marker = L.marker([result.lat, result.lng]).addTo(map)
          .bindPopup(`<b>${result.pais}</b><br>${result.regiao}`).openPopup();
        map.flyTo([result.lat, result.lng], 5, { duration: 1.2 });

      } catch (err) {
        alert('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '🔍 Rastrear Local';
      }
    }
  </script>
</body>
</html>
