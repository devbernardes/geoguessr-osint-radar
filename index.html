<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#020617">
  <title>GeoOSINT v4.0 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.puter.com/v2/"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 290px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 font-sans pb-10">

  <div class="max-w-md mx-auto space-y-3">
    <!-- Top Bar v4.0 com Seletor de IA -->
    <header class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between shadow gap-2">
      <div class="flex items-center gap-2">
        <span class="text-xl">🎯</span>
        <div>
          <h1 class="text-sm font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">GeoOSINT v4.0 PRO</h1>
          <p class="text-[10px] text-slate-400">Alta Resolução + Raciocínio OSINT</p>
        </div>
      </div>
      <select id="modelSelect" class="bg-slate-950 text-emerald-400 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 focus:outline-none">
        <option value="gpt-4o">🧠 GPT-4o (Completo)</option>
        <option value="claude-3-5-sonnet">👁️ Claude 3.5 Sonnet</option>
        <option value="gemini-2.0-flash">⚡ Gemini 2.0 Flash</option>
      </select>
    </header>

    <!-- Botões de Ação Rápida Mobile -->
    <div class="grid grid-cols-2 gap-2">
      <label class="bg-slate-900 active:bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer text-center shadow">
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        <span class="text-2xl mb-1">🖼️</span>
        <span class="text-xs font-bold text-emerald-400">Escolher Print</span>
        <span class="text-[10px] text-slate-400">Alta definição (HD)</span>
      </label>

      <button onclick="pasteFromClipboard()" class="bg-slate-900 active:bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col items-center justify-center text-center shadow">
        <span class="text-2xl mb-1">📋</span>
        <span class="text-xs font-bold text-cyan-400">Colar Print</span>
        <span class="text-[10px] text-slate-400">Da área de transferência</span>
      </button>
    </div>

    <!-- Preview Compacto + Botão Analisar -->
    <div id="previewContainer" class="hidden bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex items-center gap-3">
      <img id="previewImg" class="h-16 w-24 object-cover rounded-lg border border-slate-700" />
      <button id="analyzeBtn" onclick="analyzeImage()" 
        class="flex-grow bg-gradient-to-r from-emerald-600 to-teal-600 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg text-sm transition">
        🔍 Reanalisar Print
      </button>
    </div>

    <!-- Mapa Mundi Interativo -->
    <div class="bg-slate-900 border border-slate-800 p-1.5 rounded-xl shadow">
      <div id="map"></div>
    </div>

    <!-- Card de Resultado -->
    <div id="resultCard" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 shadow">
      <div class="flex justify-between items-start border-b border-slate-800 pb-2">
        <div>
          <h2 id="resCountry" class="text-xl font-bold text-emerald-400 leading-tight">-</h2>
          <p id="resRegion" class="text-xs text-slate-300">-</p>
        </div>
        <span id="resConfidence" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-emerald-300 border border-slate-700">-</span>
      </div>

      <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-xs font-mono">
        <div><span class="text-slate-500">LAT:</span> <span id="resLat" class="text-cyan-400">-</span></div>
        <div><span class="text-slate-500">LNG:</span> <span id="resLng" class="text-cyan-400">-</span></div>
        <a id="gmapsLink" href="#" target="_blank" class="text-emerald-400 underline font-sans font-semibold">Abrir Maps ↗</a>
      </div>

      <div>
        <h3 class="text-[11px] uppercase tracking-wider text-slate-400 mb-1.5 font-semibold">Análise Técnica GeoGuessr:</h3>
        <ul id="resClues" class="text-xs text-slate-300 space-y-1.5 list-disc list-inside"></ul>
      </div>
    </div>
  </div>

  <script>
    let currentDataUrl = null;
    let map, marker;

    window.onload = () => {
      map = L.map('map', { zoomControl: true }).setView([20, 0], 2);
      L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        attribution: '&copy; Google Maps'
      }).addTo(map);
    };

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          compressAndLoadImage(item.getAsFile());
          break;
        }
      }
    });

    async function pasteFromClipboard() {
      try {
        const clipboardItems = await navigator.clipboard.read();
        for (const item of clipboardItems) {
          const imageType = item.types.find(type => type.startsWith('image/'));
          if (imageType) {
            const blob = await item.getType(imageType);
            compressAndLoadImage(blob);
            return;
          }
        }
        alert('Nenhuma imagem encontrada na área de transferência.');
      } catch (err) {
        alert('Permita o acesso à área de transferência ou use o botão "Escolher Print".');
      }
    }

    function handleFileSelect(e) {
      if (e.target.files.length > 0) compressAndLoadImage(e.target.files[0]);
    }

    // Mantém alta resolução (1920px) para não borrar placas e bollards
    function compressAndLoadImage(file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1920;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          
          currentDataUrl = canvas.toDataURL('image/jpeg', 0.92);
          document.getElementById('previewImg').src = currentDataUrl;
          document.getElementById('previewContainer').classList.remove('hidden');
          analyzeImage();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function analyzeImage() {
      if (!currentDataUrl) return;

      const selectedModel = document.getElementById('modelSelect').value;
      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      btn.innerText = `🧠 Analisando (${selectedModel})...`;

      // Prompt Chain-of-Thought: obriga a IA a analisar as pistas ANTES de concluir o país
      const prompt = `Você é um jogador profissional Top 1 Mundial de GeoGuessr.
Analise esta captura de tela do Google Street View ignorando completamente a interface/HUD do jogo (bússola, bonecos, botões, barras do celular).

Siga estritamente esta ordem de dedução (Meta do GeoGuessr):
1. Mão de direção (direita ou esquerda) e formato/cor das placas dos veículos (ex: faixa azul europeia, placa amarela, placa longa ou curta).
2. Pintura da pista (linhas centrais amarelas vs brancas, tracejado das bordas) e formato dos bollards (balizadores de estrada) ou guard-rails.
3. Formato dos postes de energia (concreto furado húngaro/romeno, concreto quadrado brasileiro, madeira com listras amarelas japonês/taiwanês, etc.).
4. Textos visíveis em placas de rua, outdoors, lixeiras, arquitetura das casas, cor do solo e vegetação.

IMPORTANTE: Preencha PRIMEIRO o array "pistas" com o que você realmente enxerga na imagem e SÓ DEPOIS deduza o "pais", "regiao" e coordenadas reais ("lat" e "lng").
Retorne EXCLUSIVAMENTE um objeto JSON válido (sem blocos markdown):
{
  "pistas": [
    "Mão de direção e placas: ...",
    "Estrada, postes e sinalização: ...",
    "Arquitetura, textos ou ambiente: ..."
  ],
  "pais": "Nome do País em Português",
  "regiao": "Estado, província ou cidade específica",
  "lat": 0.0,
  "lng": 0.0,
  "confianca": "Alta | Média | Baixa"
}`;

      try {
        const response = await puter.ai.chat(prompt, currentDataUrl, { model: selectedModel });
        const rawText = (response?.message?.content || response.toString()).replace(/```json|```/g, '').trim();
        const result = JSON.parse(rawText);

        let lat = parseFloat(result.lat);
        let lng = parseFloat(result.lng);

        if (!lat || !lng || (Math.abs(lat) < 0.1 && Math.abs(lng) < 0.1)) {
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(result.regiao + ', ' + result.pais)}`);
          const geoData = await geoRes.json();
          if (geoData && geoData.length > 0) {
            lat = parseFloat(geoData[0].lat);
            lng = parseFloat(geoData[0].lon);
          }
        }

        document.getElementById('resultCard').classList.remove('hidden');
        document.getElementById('resCountry').innerText = result.pais;
        document.getElementById('resRegion').innerText = result.regiao;
        document.getElementById('resConfidence').innerText = result.confianca;
        document.getElementById('resLat').innerText = lat.toFixed(4);
        document.getElementById('resLng').innerText = lng.toFixed(4);
        document.getElementById('gmapsLink').href = `https://www.google.com/maps?q=${lat},${lng}`;

        const cluesList = document.getElementById('resClues');
        cluesList.innerHTML = '';
        result.pistas.forEach(c => {
          const li = document.createElement('li');
          li.innerText = c;
          cluesList.appendChild(li);
        });

        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map)
          .bindPopup(`<b>${result.pais}</b><br>${result.regiao}`).openPopup();
        map.flyTo([lat, lng], 6, { duration: 1.3 });

      } catch (err) {
        alert('Erro ao analisar com este modelo. Tente trocar o modelo no topo da tela! Detalhe: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '🔍 Reanalisar Print';
      }
    }
  </script>
</body>
</html>
